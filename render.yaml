databases:
  - name: team-task-manager-db
    plan: free
    databaseName: team_task_manager

services:
  - type: web
    name: team-task-manager-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node scripts/migrate.js && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: team-task-manager-db
          property: connectionString
